<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>OTML Corridor</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Barlow+Condensed:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#EEF1EE; --paper:#FFFFFF; --ink:#1F2B27; --muted:#5C6964; --line:#D3D9D5;
  --road:#9C8B67; --gap:#C9CFCB; --hivis:#F2B705; --hivis-ink:#2A2200;
  --red:#C2362B; --red-soft:#F7DEDB; --amber-soft:#FCF0C8; --green:#2F7A4F; --blue:#2F64A0; --blue-soft:#DCE7F4;
  color-scheme:light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#141A18; --paper:#1D2522; --ink:#E6ECE9; --muted:#9AA7A2; --line:#33403B;
    --road:#A8976F; --gap:#3A4642; --hivis:#F2B705; --hivis-ink:#2A2200;
    --red:#EF6A5E; --red-soft:#3B201D; --amber-soft:#3A3115; --green:#5FBF86; --blue:#79A8E0; --blue-soft:#1C2C40;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#141A18; --paper:#1D2522; --ink:#E6ECE9; --muted:#9AA7A2; --line:#33403B;
  --road:#A8976F; --gap:#3A4642; --hivis:#F2B705; --hivis-ink:#2A2200;
  --red:#EF6A5E; --red-soft:#3B201D; --amber-soft:#3A3115; --green:#5FBF86; --blue:#79A8E0; --blue-soft:#1C2C40;
  color-scheme:dark;
}
:root{--croad:#3a433d;--cweak:#d9c79b;--cbg:#eef0ea;--gA:#b8740a;--g1:#1c7086;--g2:#7a4790;--g3:#b0432c;--gx:#55606a;--stale:#8b938d;--okbg:#e2efe6;--okfg:#22573a;--errbg:#f6e3dd;--errfg:#8a2f1c}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--croad:#b9c2bb;--cweak:#5e5232;--cbg:#161a18;--gA:#e3a43a;--g1:#4fb3cc;--g2:#b98bd0;--g3:#e57a60;--gx:#9aa6b0;--stale:#6c756f;--okbg:#1f3328;--okfg:#9fd8b3;--errbg:#3a221c;--errfg:#f0a893}}
:root[data-theme="dark"]{--croad:#b9c2bb;--cweak:#5e5232;--cbg:#161a18;--gA:#e3a43a;--g1:#4fb3cc;--g2:#b98bd0;--g3:#e57a60;--gx:#9aa6b0;--stale:#6c756f;--okbg:#1f3328;--okfg:#9fd8b3;--errbg:#3a221c;--errfg:#f0a893}
.cgrid{display:grid;grid-template-columns:minmax(0,600px) minmax(0,1fr);gap:20px;align-items:start}
@media (max-width:1180px){.cgrid{grid-template-columns:minmax(0,1fr)}.cmapbox{max-width:640px;margin:0 auto;width:100%}}
@media (max-width:700px){#cmap{max-height:68vh;width:auto;max-width:100%;margin:0 auto}.clegend{font-size:12px}}
.cmapbox{background:var(--paper);border:1px solid var(--line);border-radius:6px;padding:8px}
#cmap{display:block;width:100%;height:auto}
.cmapbox .km{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:10.5px;fill:var(--muted)}
.cmapbox .lbl{font-family:"Barlow Condensed",sans-serif;font-weight:600;font-size:15px}
.cmapbox .units{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:10.5px}
.clegend{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:13px;color:var(--muted);padding:8px 6px 4px}
.clegend span{display:inline-flex;align-items:center;gap:6px}
.ccards{display:grid;gap:12px}
.ccard{background:var(--paper);border:1px solid var(--line);border-left:5px solid var(--c);border-radius:6px;padding:10px 12px;min-width:0}
.ccard h3{font-family:"Barlow Condensed",sans-serif;font-weight:600;font-size:20px;margin:0;display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 10px}
.cpill{font:700 11px Barlow,sans-serif;text-transform:uppercase;letter-spacing:.08em;padding:2px 8px;border-radius:99px;background:var(--c);color:var(--paper)}
.ccard .csub{color:var(--muted);font-size:14px;margin:2px 0 8px}
.ccard table td{white-space:nowrap} .ccard{overflow:hidden} .ccard>div{overflow-x:auto}
.ccard td.u{font-family:ui-monospace,Menlo,Consolas,monospace;font-weight:600}
.cst{display:inline-flex;align-items:center;gap:5px;font-size:13px;font-weight:700}
.cst::before{content:"";width:8px;height:8px;border-radius:50%;background:currentColor}
.cst-moving{color:var(--okfg)} .cst-parked{color:var(--muted)} .cst-unknown{color:var(--g3)}
.cfs{display:inline-block;min-width:2.2em;text-align:center;font-weight:700;font-size:13px;padding:1px 6px;border-radius:4px}
.cfs-ok{background:var(--okbg);color:var(--okfg)} .cfs-watch{background:color-mix(in srgb,var(--gA) 18%,transparent);color:var(--gA)} .cfs-low{background:var(--errbg);color:var(--errfg)}

.apps{display:flex;flex-wrap:wrap;align-items:center;gap:8px 10px;margin:0 0 10px}
.apps-lbl{font-size:.7rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:700}
.app{display:inline-flex;align-items:center;gap:6px;font-weight:700;font-size:.86rem;color:var(--ink);text-decoration:none;border:1px solid var(--line);background:var(--paper);border-radius:99px;padding:4px 11px}
.app i{width:8px;height:8px;border-radius:50%;background:var(--stale)}
.app small{font-weight:600;font-size:.76rem;color:var(--muted)}
.app.ok i{background:var(--okfg)} .app.feed i{background:var(--gA)} .app.login i{background:var(--g3)} .app.login small{color:var(--g3)}
.tabs{display:flex;gap:4px;overflow-x:auto;border-bottom:2px solid var(--line);margin:0 0 14px;position:sticky;top:env(safe-area-inset-top,0px);background:var(--bg,var(--paper));z-index:5;scrollbar-width:none}
.tab{font:600 16px "Barlow Condensed",sans-serif;letter-spacing:.02em;background:none;border:0;border-bottom:3px solid transparent;padding:10px 14px;color:var(--muted);cursor:pointer;white-space:nowrap}
.tab.on{color:var(--ink);border-bottom-color:var(--ink)}
.tcount{display:inline-block;min-width:1.3em;background:var(--red);color:#fff;border-radius:99px;font-size:12px;padding:0 5px;margin-left:4px}
.tcount:empty{display:none}
[data-tab]{display:none} [data-tab].on{display:block} [data-tab]:not(.on){display:none!important}
.ask{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:0 0 12px}
.ask input[type=text]{flex:1;min-width:180px;font:16px inherit;padding:11px 12px;border:1px solid var(--line);border-radius:6px;background:var(--paper);color:var(--ink)}
.askmic{font-size:20px;width:48px;height:46px;border-radius:50%;border:1px solid var(--line);background:var(--paper);cursor:pointer}
.askmic.rec{background:var(--red);border-color:var(--red)}
.askv{font-size:13px;color:var(--muted)} .askout{flex-basis:100%;font-size:16px}
.askq{color:var(--muted);font-size:14px} .aska{font-weight:600;margin-top:2px}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px;margin:0 0 14px}
@media (max-width:520px){.tiles{grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}}
.tile{display:flex;flex-direction:column;align-items:flex-start;gap:2px;text-align:left;background:var(--paper);border:1px solid var(--line);border-left:5px solid var(--green);border-radius:6px;padding:12px 14px;cursor:pointer;color:var(--ink);font-family:inherit;min-height:112px}
.tile.amber{border-left-color:#d6a21a}
.tile.standout,.standout{background:color-mix(in srgb,#d6a21a 14%,var(--paper))}
.standout{display:flex;flex-direction:column;gap:2px;border:1px solid var(--line);border-left:5px solid #d6a21a;border-radius:6px;padding:10px 14px;margin:6px 0 12px;max-width:520px} .tile.red{border-left-color:var(--red)}
.tile:hover{border-color:var(--ink)}
.tl{font:700 12px "Barlow",sans-serif;text-transform:uppercase;letter-spacing:.07em;color:var(--muted)}
.tb{font:700 38px/1.05 "Barlow Condensed",sans-serif} .tb small{font-size:20px;font-weight:600;color:var(--muted)}
.ts{font-size:14px;color:var(--muted);line-height:1.3}
@media (max-width:520px){.tb{font-size:30px}.ts{font-size:13px}.tile{min-height:100px;padding:10px}}
.topalerts{background:var(--paper);border:1px solid var(--line);border-left:5px solid var(--red);border-radius:6px;padding:10px 14px;margin:0 0 14px}
.ta{font-size:15px;padding:6px 0;border-top:1px solid var(--line)} .ta:first-of-type{border-top:0}
.more{background:none;border:0;color:var(--ink);font-weight:700;text-decoration:underline;padding:6px 0;cursor:pointer}
.actions{display:flex;flex-wrap:wrap;gap:10px;margin:0 0 10px} .actions .ghost{border:1px solid var(--line);border-radius:6px;padding:10px 14px;color:var(--ink);text-decoration:none;font-weight:600}
.srcline{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:13px;color:var(--muted)} .srcline i{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:5px;background:var(--red)} .srcline i.ok{background:var(--green)} .srcline i.feed{background:#d6a21a}
section.flags[data-tab].on{display:grid}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.45 Barlow,"Segoe UI",Roboto,Arial,sans-serif;font-variant-numeric:tabular-nums}
.wrap{max-width:1180px;margin:0 auto;padding:20px 18px 48px}
h1,h2,.num{font-family:"Barlow Condensed","Arial Narrow",Barlow,sans-serif}
header{display:flex;flex-wrap:wrap;gap:12px 24px;align-items:flex-end;justify-content:space-between;margin-bottom:18px}
h1{font-size:clamp(28px,4vw,40px);font-weight:700;margin:0;line-height:1}
.sub{color:var(--muted);margin-top:6px}
button{font:600 15px Barlow,sans-serif;border:0;border-radius:6px;padding:10px 16px;background:var(--hivis);color:var(--hivis-ink);cursor:pointer}
button:focus-visible,a:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
.flags{display:grid;gap:8px;margin-bottom:20px}
.flag{display:flex;gap:12px;align-items:flex-start;padding:10px 14px;border-radius:6px;background:var(--amber-soft);border-left:6px solid var(--hivis)}
.flag.red{background:var(--red-soft);border-left-color:var(--red)}
.flag b{font-family:"Barlow Condensed",sans-serif;font-size:17px;min-width:64px}
/* road strip hero */
.strip{background:var(--paper);border-radius:10px;padding:18px 18px 10px;margin-bottom:22px}
.strip h2{margin:0 0 4px;font-size:24px}
.strip-scroll{overflow-x:auto}
.strip svg{display:block;min-width:640px;width:100%;height:auto}
.legend{display:flex;flex-wrap:wrap;gap:6px 18px;color:var(--muted);font-size:14px;margin-top:6px}
.legend i{display:inline-block;width:18px;height:8px;border-radius:2px;margin-right:6px;vertical-align:middle}
.groups{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px;margin-top:12px}
.grp{border-top:3px solid var(--line);padding-top:8px}
.grp.move{border-top-color:var(--hivis)}
.grp.silent{border-top-color:var(--red)}
.grp h3{margin:0;font:600 16px Barlow,sans-serif}
.grp .ids{font-family:"Barlow Condensed",sans-serif;font-size:18px;font-weight:600;letter-spacing:.02em}
.grp p{margin:2px 0;color:var(--muted);font-size:14px}
/* panels */
.grid{display:grid;grid-template-columns:repeat(12,1fr);gap:18px}
.panel{background:var(--paper);border-radius:10px;padding:16px 18px;grid-column:span 6;min-width:0}
.panel.wide{grid-column:span 12}
.panel.third{grid-column:span 4}
@media (max-width:900px){.panel,.panel.third{grid-column:span 12}}
.ph{display:flex;justify-content:space-between;align-items:baseline;gap:10px;margin-bottom:10px}
.ph h2{margin:0;font-size:24px}
.state{font-size:13px;font-weight:600;padding:2px 8px;border-radius:20px;white-space:nowrap}
.state.live{background:color-mix(in srgb,var(--green) 18%,transparent);color:var(--green)}
.state.pending{background:var(--amber-soft);color:var(--ink)}
.state.missing{background:var(--red-soft);color:var(--red)}
.big{font-size:44px;font-weight:700;line-height:1}
.muted{color:var(--muted)}
.small{font-size:14px}
table{border-collapse:collapse;width:100%}
td,th{padding:6px 8px 6px 0;text-align:left;border-bottom:1px solid var(--line);vertical-align:top}
th{font-weight:600;color:var(--muted);font-size:14px}
td.r,th.r{text-align:right}
.convoy{padding:10px 0;border-bottom:1px solid var(--line)}
.convoy:last-child{border-bottom:0}
.convoy h3{margin:0 0 2px;font:600 18px Barlow,sans-serif;display:flex;gap:10px;align-items:baseline;flex-wrap:wrap}
.convoy .tag{font-size:13px;font-weight:600;color:var(--muted)}
.convoy p{margin:2px 0}
.tank{display:grid;grid-template-columns:110px 1fr 104px;gap:10px;align-items:center;margin:8px 0}
.bar{position:relative;height:14px;background:var(--bg);border-radius:3px;overflow:hidden}
.bar i.suction{position:absolute;top:-2px;bottom:-2px;width:3px;background:var(--red);margin-left:-1px}
.bar span{display:block;height:100%;background:var(--blue)}
.farm{margin-bottom:14px}
.farm h3{margin:0 0 2px;font:600 17px Barlow,sans-serif}
.score{display:inline-block;min-width:38px;text-align:center;font-weight:700;border-radius:4px;padding:1px 6px;color:#fff}
.stale{color:var(--red);font-weight:600}
ul.plain{margin:0;padding-left:18px}
ul.plain li{margin:4px 0}
.plan{position:relative;height:18px;background:var(--bg);border-radius:3px;margin:10px 0 4px}
.plan span{position:absolute;left:0;top:0;bottom:0;background:var(--hivis);border-radius:3px}
.plan i{position:absolute;top:-4px;bottom:-4px;width:2px;background:var(--ink)}
dialog{border:0;border-radius:10px;padding:18px;max-width:640px;width:92vw;background:var(--paper);color:var(--ink)}
dialog textarea{width:100%;height:50vh;font:14px/1.4 Barlow,sans-serif;background:var(--bg);color:var(--ink);border:1px solid var(--line);border-radius:6px;padding:10px}
.row{display:flex;gap:10px;justify-content:flex-end;margin-top:10px}
button.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
footer{color:var(--muted);font-size:13px;margin-top:22px}
</style>
</head>

<div class="wrap" id="app"></div>

<dialog id="msgDlg">
  <textarea id="msgText" aria-label="WhatsApp update text"></textarea>
  <div class="row"><button class="ghost" id="closeBtn">Close</button><button id="copyBtn">Copy text</button></div>
</dialog>

<script>
/* ---------- DATA: edit this block, or have the PC replace it daily ---------- */
let D = null;
const KL = l => l==null ? null : Math.round(l/1000);
const hhmm = iso => iso ? iso.slice(11,16) : "";
const to24 = s => String(s||"").replace(/(\d{1,2}):(\d{2})\s*([AP]M)/i,(x,h,mm,ap)=>String((+h%12)+(ap.toUpperCase()==="PM"?12:0)).padStart(2,"0")+":"+mm);
const dayName = d => d.toLocaleDateString("en-AU",{weekday:"short",day:"numeric",month:"short",year:"numeric",timeZone:"Pacific/Port_Moresby"});
function nextHotshot(now){
  const d=new Date(now.getTime()); d.setHours(d.getHours()+ (d.getHours()>=6?24:0));
  while([0,6].includes(d.getDay())) d.setDate(d.getDate()+1);
  return d.toLocaleDateString("en-AU",{weekday:"short",day:"numeric",month:"short"})+", 06:00 from TE";
}
function clusterRoad(onRoad){
  const out=[];
  for(const dir of ["north","south",null]){
    const s=onRoad.filter(u=>(u.dir||null)===dir).sort((a,b)=>a.km-b.km);
    for(const u of s){ const g=out[out.length-1];
      if(g && g.dir===dir && u.km-g.kmMax<=3){ g.units.push(u); g.kmMax=u.km; } else out.push({units:[u],kmMax:u.km,dir}); }
  }
  return out;
}
function fatigueFlags(D){
  const out=[];
  (D.drivers||[]).forEach(d=>{
    const where=d.onRoad?`on the road at KM${Math.round(d.onRoad.km)}`:"not on the road now";
    const cam=d.cam.map(e=>`${e.type} ${e.n}× (last ${e.last})`).join(", ");
    if(d.level==="alarm") out.push({lvl:"red",tag:"Fatigue alarm",text:`${d.name} (${d.trucks.join(", ")}, ${where}): Readi ${d.readi.score} and driver camera ${cam} in the last 12 h.`});
    else if(d.level==="warn") out.push({lvl:"red",tag:"Fatigue",text:`${d.name} is driving (${d.trucks.join(", ")}, KM${Math.round(d.onRoad.km)}) with ${d.readi&&d.readi.score<70?"Readi "+d.readi.score:"driver camera "+cam}.`});
  });
  D.flags=[...out,...D.flags];
}
function toD(c, m){
  const t=c.trucks||{}, pos=t.positions||{aiambak:[],west_bank:[],on_road:[],off_corridor:[],not_reporting:[]};
  const f=c.fuel||{}, fk=(f.farms||{}).kiunga, ft=(f.farms||{}).tabubil, b=c.bags||{}, fa=c.fatigue||{};
  const gen=new Date(c.generated), flags=[];
  for(const [k,label] of [["fuel","Fuel"],["bags","Bags"],["trucks","Trakpro"],["fatigue","Readi"],["prestarts","ChekRite"]]){
    const st=(c[k]||{}).state; if(st && st!=="live") flags.push({lvl:"amber",tag:"Feed",text:`${label} ${st==="missing"?"not available":"stale"}: ${(c[k]||{}).note||""}`});
  }
  const lowNow=(fa.rows||[]).filter(r=>r.now_below);
  const roles=m.crew_roles||{};
  lowNow.forEach(r=>flags.push({lvl:r.score<60||roles[r.name]?"red":"amber",tag:"Fatigue",text:`${r.name}${roles[r.name]?" ("+roles[r.name]+")":""} ReadiScore ${r.score} now (sync ${r.sync}).`}));
  (fa.rows||[]).filter(r=>!r.now_below && roles[r.name]).forEach(r=>flags.push({lvl:"amber",tag:"Fatigue",text:`${r.name} (${roles[r.name]}) reaches 70 at ${to24(r.when.replace("At ",""))}.`}));
  const stale=(pos.on_road||[]).filter(u=>u.fix_age_min>60);
  if(stale.length) flags.push({lvl:"amber",tag:"Tracker",text:`No fix for over an hour: ${stale.map(u=>`${u.unit} (KM${Math.round(u.km)}, last ${u.last_fix})`).join(", ")}.`});
  if((pos.not_reporting||[]).length) flags.push({lvl:"amber",tag:"Tracker",text:`Not reporting away from the road ends: ${(pos.silent_detail||[]).length?pos.silent_detail.map(x=>`${x.unit} (last KM${Math.round(x.km)}, ${x.last_fix})`).join(", "):pos.not_reporting.join(", ")}.`});
  if((pos.off_corridor||[]).length) flags.push({lvl:"amber",tag:"Tracker",text:`Off the corridor: ${pos.off_corridor.map(u=>`${u.unit} (${Math.round(u.off_km)} km away)`).join(", ")}.`});
  const fl=c.fleet||{};
  (fl.down||[]).forEach(a=>{ const u=(pos.on_road||[]).find(x=>x.unit===a.trakpro_id);
    if(u) flags.push({lvl:"red",tag:"Fleet",text:`${a.id} is listed DOWN in the shift report but Trakpro shows it on the road at KM${Math.round(u.km)}.`}); });
  {const cu=(c.inbox||{}).cucon; if(cu){ const age=cu.date?Math.round((gen-new Date(cu.date+"T12:00:00+10:00"))/864e5):null;
     if(age!=null&&age>1) flags.push({lvl:"amber",tag:"CuCon",text:`CuCon bagging report is from ${cu.date.slice(8,10)}/${cu.date.slice(5,7)} (${age} days old). Drop the latest Cucon_bagging_operation file into the Corridor folder.`});
     (cu.checks||[]).filter(x=>!/estimates/.test(x)).forEach(x=>flags.push({lvl:"amber",tag:"CuCon",text:x}));
     const bp=(cu.stages||[]).find(x=>/bagged/i.test(x.name)), wk=(c.bags||{}).since_1_oct;
     if(bp&&wk&&bp.ptd_bags&&Math.abs(wk-bp.ptd_bags)/bp.ptd_bags>0.05) flags.push({lvl:"amber",tag:"CuCon",text:`Wakata shows ${wk.toLocaleString("en-AU")} Bulka bags but the bagging report says ${bp.ptd_bags.toLocaleString("en-AU")} bagged to ${cu.date.slice(8,10)}/${cu.date.slice(5,7)}. Wakata is ${Math.round(100*wk/bp.ptd_bags)} % of the report, so bag tags are not all being entered.`});}}
  Object.entries(((c.fuel||{}).site_errors)||{}).forEach(([site,msg])=>flags.push({lvl:"amber",tag:"Fuel",text:`${site.charAt(0).toUpperCase()+site.slice(1)} tank console not reachable; its figures are from the last good reading. Check the console link or ask IT.`}));
  ((c.fleet||{}).checks||[]).forEach(x=>flags.push({lvl:"amber",tag:"Shift report",text:x}));

// ---------- Ask: type or speak a simple question, answered from the dashboard's own data ----------
const NUMW={one:1,two:2,three:3,four:4,five:5,six:6,seven:7,eight:8,nine:9,ten:10,eleven:11,twelve:12,thirteen:13,fourteen:14,fifteen:15,sixteen:16,seventeen:17,eighteen:18,nineteen:19,twenty:20,"twenty one":21,"twenty two":22,"twenty three":23,"twenty four":24};
function askNormalise(q){
  let x=" "+String(q||"").toLowerCase().replace(/[?.,!]/g," ")+" ";
  for(const [w,n] of Object.entries(NUMW).sort((a,b)=>b[0].length-a[0].length)) x=x.replace(new RegExp("\\b"+w+"\\b","g"),String(n));
  x=x.replace(/\b(i\s*t|eye\s*tee|i\s*tee|it)\s*0?(\d{1,2})\b/g,(m,a,n)=>" it"+String(n).padStart(2,"0")+" ")
     .replace(/\bt\s*t\s*(\d{2})\b/g," tt$1 ").replace(/\bh\s*t\s*22\b/g," ht22 ").replace(/\bl\s*(\d{4})\b/g," l$1 ")
     .replace(/\bt\s*(2\d\d)\b/g," t$1 ");
  return x.replace(/\s+/g," ").trim();
}
function askAnswer(q0){
  const q=askNormalise(q0), c=c0raw||{}, t=c.trucks||{}, raw=t.raw||{}, st=raw.status||{}, es=raw.escorts||{}, G=D.cmap||[];
  const m=(c0manual||{}), roles=m.crew_roles||{}, people=Object.assign({},m.people||{});
  const pairs=((c.prestarts||{}).pairs_today)||[];
  const hm=ts=>ts?new Date((ts+36000)*1000).toISOString().slice(11,16):"";
  const groupOf=u=>G.find(g=>g.units.some(x=>x.n===u));
  const driverOf=u=>{const p=pairs.find(p=>p.trakpro_id===u); return p&&p.driver;};
  const readiOf=name=>{if(!name) return null; const a=name.toLowerCase().split(/\s+/); return ((c.fatigue||{}).rows||[]).find(r=>{const b=r.name.toLowerCase(); return a.every(w=>b.includes(w.slice(0,4)));});};
  const disp=u=>/^TT(1[5-9]|2\d)$/.test(u)?"IT"+u.slice(2):u;
  const unitAns=u=>{
    const x=st[u]||es[u]; if(!x||x.km==null) return `I have no position for ${disp(u)} right now.`;
    const age=x.t?Math.round((Date.now()/1000-x.t)/60):null, g=groupOf(u), drv=driverOf(u), rd=readiOf(drv);
    let where = x.km<=2?"at Aiambak":x.km>=180?"at West Bank Kiunga":`on the road at KM${Math.round(x.km)}`;
    let move = x.km>2&&x.km<180 ? ((x.km_30min||0)<-1?", heading south to Aiambak":(x.km_30min||0)>1?", heading north to West Bank":", stopped") : "";
    let speed = x.speed>3?` at ${x.speed} km/h`:"";
    let s=`${disp(u)} is ${where}${move}${speed}`;
    s+= age!=null&&age>30?`. No GPS for ${age} minutes, last fix ${hm(x.t)}`:`, last fix ${hm(x.t)}`;
    if(g&&!/^Also at|^Other/.test(g.name)) s+=`. It is in ${g.name}`;
    const cv=(D.convoys||[]).find(o=>g&&o.name&&o.name.startsWith(g.name)); const eta=cv&&(cv.status||"").match(/(Predicted arrival|ETA)[^.]*\./); if(eta&&x.km>2&&x.km<180) s+=`. ${eta[0].replace(/\.$/,"")}`;
    if(drv) s+=`. Driver ${drv}${rd?`, Readi ${rd.score}`:""}`;
    return s+".";
  };
  // 1. unit numbers
  const um=q.match(/\b(it\d{2}|tt\d{2}|l\d{4}|ht22)\b/);
  if(um){ let u=um[1].toUpperCase(); if(/^IT(1[5-9]|2\d)$/.test(u)) u="TT"+u.slice(2); return unitAns(u); }
  // 2. people: escorts, crew roles, today's drivers
  const names=new Set([...Object.keys(people),...Object.keys(roles),...pairs.map(p=>p.driver).filter(Boolean)]);
  for(const nm of names){ const parts=nm.toLowerCase().split(/\s+/); if(parts.some(w=>w.length>2&&q.includes(w))){
      let u=people[nm]||null; if(!u){const p=pairs.find(p=>p.driver===nm); u=p&&p.trakpro_id;}
      const role=roles[nm]?` (${roles[nm]})`:"";
      if(!u){const rm=(roles[nm]||"").match(/\b(IT\d\d|TT\d\d|L\d{4}|HT22)\b/); u=rm&&rm[1];}
      return u?`${nm}${role} is in ${disp(u)}. `+unitAns(u):`I know ${nm}${role} but not which vehicle they are in today.`; } }
  // 3. convoys
  const cm=q.match(/\b(convoy|southbound|northbound)\s*(\d)\b/);
  if(cm && /arriv|eta|what time|when|due/.test(q)){ const nm=(cm[1]==="southbound"?"Southbound ":"Convoy ")+cm[2];
    const cv=((c0raw.trucks||{}).convoys||[]).filter(o=>o.name===nm).sort((a,b)=>a.date<b.date?1:-1)[0];
    if(!cv) return `I can't see ${nm} today.`;
    const dest=cv.to||(cv.direction==="north"?"West Bank":"Aiambak");
    if(cv.arrived) return `${nm} arrived at ${dest} ${cv.arrived[0]}${cv.arrived[1]&&cv.arrived[1]!==cv.arrived[0]?" to "+cv.arrived[1]:""}, a ${cv.run_h} hour run.`;
    if(cv.eta) return `${nm} is expected at ${dest} between ${cv.eta[0]} and ${cv.eta[1]}${cv.km?`. It is now at KM${cv.km[0]}${cv.km[1]!==cv.km[0]?" to "+cv.km[1]:""}`:""}${cv.eta_miss_min?`, usually within ${cv.eta_miss_min} minutes`:""}.`;
    return `${nm} has left${cv.departed?" at "+cv.departed[0]:""}, but there is no arrival estimate yet.`; }
  if(cm){ const nm=(cm[1]==="convoy"||cm[1]==="northbound"?"Convoy ":"Southbound ")+cm[2]; const cv=(D.convoys||[]).find(o=>o.name.startsWith(nm));
    const g=G.find(g=>g.name.startsWith(nm)); return cv?`${nm}: ${g?g.units.filter(u=>!u.esc).map(u=>disp(u.n)).join(", ")+". ":""}${cv.status}`:`I can't see ${nm} today.`; }
  // 4. fuel, bags
  if(/fuel|diesel|tank/.test(q)){ const f=D.fuel; return `Fuel above safety buffers: ${f.availableTotal!=null?Math.round(f.availableTotal/1000).toLocaleString("en-AU")+" kL":"not known"}. ${(f.farms||[]).map(fm=>fm.x?`${fm.name} ${fm.x.available<0?"below buffer by "+Math.round(-fm.x.available/1000):"above buffer by "+Math.round(fm.x.available/1000)} kL`:"").filter(Boolean).join(". ")}.`; }
  if(/bag|copper|cucon|concentrate/.test(q)){ const cu=D.cucon; if(!cu) return `Wakata shows ${D.bags.sinceOct1} bulka bags since 1 October.`;
    const g=k=>(cu.stages||[]).find(x=>x.name.toLowerCase().includes(k))||{}; return `CuCon report ${cu.date.slice(8,10)}/${cu.date.slice(5,7)}: bagged ${g("bagged").day_bags} that day against ${g("bagged").target_bags}. To date ${g("bagged").ptd_bags} bagged, ${g("trucked").ptd_bags} trucked to Aiambak, ${g("loaded").ptd_bags} shipped.`; }
  if(/how many|on the road|trucks/.test(q)){ const n=f=>G.reduce((a,g)=>a+g.units.filter(f).length,0);
    return `${n(u=>!u.esc&&u.k>2&&u.k<180&&!u.stale)} trucks moving on the road, ${n(u=>!u.esc&&u.k>2&&u.k<180&&u.stale)} with no GPS, ${n(u=>!u.esc&&u.k>=180)} at West Bank and ${n(u=>!u.esc&&u.k<=2)} at Aiambak.`; }
  return `Try: where is IT15, what time will Convoy 1 arrive at West Bank, where is Southbound 1, how much fuel, how many bags, or how many trucks on the road.`;
}
function askRun(q){ const out=document.getElementById("askOut"); if(!out) return; const a=askAnswer(q);
  out.innerHTML=`<div class="askq">“${esc(q)}”</div><div class="aska">${esc(a)}</div>`;
  try{ if(document.getElementById("askVoice").checked && window.speechSynthesis){ speechSynthesis.cancel(); const u=new SpeechSynthesisUtterance(a); u.lang="en-AU"; u.rate=1.0; speechSynthesis.speak(u);} }catch(e){} }
function askWire(){
  const inp=document.getElementById("askIn"), mic=document.getElementById("askMic"); if(!inp) return;
  document.getElementById("askGo").onclick=()=>askRun(inp.value);
  inp.onkeydown=e=>{ if(e.key==="Enter") askRun(inp.value); };
  const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
  if(!SR){ mic.title="Voice input is not supported in this browser; type the question instead."; mic.disabled=false; mic.onclick=()=>{document.getElementById("askOut").textContent="Voice input isn't available in this browser. Type the question, or use Chrome or Safari.";}; return; }
  mic.onclick=()=>{ try{ const r=new SR(); r.lang="en-AU"; r.interimResults=false; r.maxAlternatives=1;
      mic.classList.add("rec"); document.getElementById("askOut").textContent="Listening…";
      r.onresult=e=>{ const q=e.results[0][0].transcript; inp.value=q; askRun(q); };
      r.onerror=e=>{ document.getElementById("askOut").textContent=e.error==="not-allowed"?"Allow the microphone for this page, then try again.":"Didn't catch that. Try again or type it."; };
      r.onend=()=>mic.classList.remove("rec"); r.start(); }catch(e){ document.getElementById("askOut").textContent="Couldn't start the microphone."; } };
}

      <div style="overflow-x:auto"><table class="small"><tr><th>Time</th><th>Truck</th><th>Event</th><th>Near</th><th></th></tr>
      ${D.adas.events.map(e=>`<tr><td>${esc(e.label)}</td><td><b>${esc(e.unit)}</b></td><td style="color:${e.fatigue?"var(--red)":"inherit"}">${esc(e.type.toLowerCase())}</td><td class="muted">${esc(e.where||"")}${e.map?` · <a href="${esc(e.map)}" target="_blank" rel="noopener">map</a>`:""}</td><td><a href="${esc(D.adasUrl)}" target="_blank" rel="noopener" title="In Trakpro: Video › Files › search ${esc(e.unit)} › ${esc(e.time)}">Find in Trakpro</a></td></tr>`).join("")}</table></div>
      <p class="muted small">Each event has a clip in Trakpro: open Trakpro, click Video › Files, search the truck number, and the clip is listed under the same date and time.</p>`:""}
      <p class="muted small">Eyes closed and yawning are fatigue signs. Camera cover means the driver camera was blocked. ${D.adas.cameras} dashcams checked; trucks with no events are not listed. Covers drivers whose Readi watch data is lagging.</p>`:`<p class="muted small">${D.adas?"No ADAS/DMS events in the last 24 h.":"Camera events load hourly once the updated collector runs."}</p>`}
          </details>
    </section>

    <section class="panel wide" data-tab="fleet">
      <div class="ph"><h2>Equipment down</h2>${stateBadge(D.fleet?D.fleet.state:"missing", D.fleet&&D.fleet.date?D.fleet.date.slice(8,10)+"/"+D.fleet.date.slice(5,7):"")}</div>
      ${D.fleet&&(Object.keys(D.fleet.groups).length||D.fleet.down.length)?(()=>{const F=D.fleet, today=F.date?new Date(F.date+"T12:00:00+10:00"):new Date();
        const days=d=>d?Math.max(0,Math.round((today-new Date(d+"T12:00:00+10:00"))/864e5)):null;
        const dn=[...F.down].sort((x,y)=>(y.today?1:0)-(x.today?1:0)||(days(y.since)||0)-(days(x.since)||0));
        return `<div style="overflow-x:auto"><table class="small"><tr><th>Fleet</th><th class="r">Total</th><th class="r">Down</th><th class="r">Available</th><th class="r">%</th></tr>
        ${Object.entries(F.groups).map(([k,g])=>`<tr${k==="TOTAL FLEETS"?' style="font-weight:600"':""}><td>${esc(k.charAt(0)+k.slice(1).toLowerCase())}</td><td class="r">${g.total}</td><td class="r">${g.down}</td><td class="r">${g.available}</td><td class="r" style="color:${g.pct<80?"var(--red)":g.pct<90?"#B08A00":"var(--green)"}">${g.pct!=null?g.pct:"–"}</td></tr>`).join("")}</table></div>
        <h3 class="small" style="margin:12px 0 4px">Down now (${dn.length})</h3>
        <div style="overflow-x:auto"><table class="small"><tr><th>Unit</th><th>Fault</th><th>Where</th><th class="r">Days</th><th>Status</th></tr>
        ${dn.map(d=>`<tr><td><b style="color:var(--red)">${esc(d.id)}</b>${d.trakpro_id&&d.trakpro_id!==d.id?` <span class="muted">(${esc(d.trakpro_id)})</span>`:""}${d.today?' <span class="cpill" style="--c:var(--gA)">new today</span>':""}<br><span class="muted">${esc([d.make,d.type].filter(Boolean).join(" ").toLowerCase())}</span></td>
          <td>${esc(d.fault||"")}</td><td>${esc(d.location||"")}</td><td class="r">${days(d.since)!=null?days(d.since):"–"}</td><td class="muted">${esc(d.comment||"")}</td></tr>`).join("")}</table></div>
        ${F.workshop.filter(w=>w.released).length?`<p class="small" style="margin-top:8px"><b>Serviced and released today:</b> ${F.workshop.filter(w=>w.released).map(w=>esc(w.id+" ("+(w.fault||"").toLowerCase()+")")).join(", ")}.</p>`:""}
        ${F.checks.length?`<p class="small" style="color:#B08A00">${F.checks.map(esc).join(" ")}</p>`:""}
        <p class="muted small">From ${esc(F.file||"the daily shift report")}.</p>`;})()
      :`<p class="muted">${esc(D.fleet&&D.fleet.note||"No shift report yet.")}</p>`}
    </section>

    <section class="panel" data-tab="fleet">
      <div class="ph"><h2>Field notes and files</h2>${D.inbox?stateBadge(D.inbox.state, D.inbox.as_of?D.inbox.as_of.slice(11,16):""):""}</div>
      ${D.inbox&&D.inbox.notes?`
        <p class="small muted">Drop .txt, .md, .xlsx, .csv or .ods files into OneDrive &gt; Documents &gt; OTML Data &gt; Corridor. Files from the last 3 days show here; a file starting "Daily inputs" feeds the performance table.${(D.inbox.inputs_files||[]).length?" Reading: "+esc(D.inbox.inputs_files.join(", "))+".":""}</p>
        ${D.inbox.notes.map(n=>`<details><summary class="small"><b>${esc(n.file)}</b> <span class="muted">${esc(n.modified)}</span></summary><pre style="white-space:pre-wrap;font:13px/1.4 Barlow,sans-serif;margin:6px 0">${esc(n.text)}</pre></details>`).join("")}
        ${D.inbox.tables.map(tb=>`<details><summary class="small"><b>${esc(tb.file)}</b> <span class="muted">${esc(tb.modified)}, ${tb.total_rows} rows</span></summary><div style="overflow-x:auto"><table class="small">${tb.rows.map((r,i)=>`<tr>${r.map(v=>i===0?`<th>${esc(v)}</th>`:`<td>${esc(v)}</td>`).join("")}</tr>`).join("")}</table></div></details>`).join("")}
        ${!D.inbox.notes.length&&!D.inbox.tables.length?`<p class="muted small">No files in the last 3 days.</p>`:""}`
      :`<p class="muted small">${esc((D.inbox&&D.inbox.note)||"Inbox not read yet.")}</p>`}
    </section>

    <section class="panel" data-tab="fleet">
      <div class="ph"><h2>Road</h2>${stateBadge(D.road.state, D.road.asOf)}</div>
      <ul class="plain">${D.road.items.map(i=>`<li>${esc(i)}</li>`).join("")}</ul>
    </section>

    <section class="panel" data-tab="people">
      <div class="ph"><h2>Pre-starts and faults (ChekRite)</h2>${stateBadge(D.prestarts.state, D.prestarts.asOf)}</div>
      ${D.prestarts.faults?`
      <p class="small"><b>Pre-starts today: ${D.prestarts.today.length}</b> ${D.prestarts.today.length?"("+D.prestarts.today.map(x=>`${esc(x.asset)} ${esc(x.submitted.slice(6))}${x.issues?`, ${x.issues} fail`:""}`).join("; ")+")":""}</p>
      ${(D.prestarts.pairs||[]).length?`<h3 class="small" style="margin:8px 0 4px">Truck and tanker today (from ChekRite)</h3><div style="overflow-x:auto"><table class="small"><tr><th>Truck</th><th>Tanker / trailer</th><th>Driver</th><th>Pre-start</th></tr>
        ${D.prestarts.pairs.map(p=>`<tr><td><b>${esc(p.truck)}</b>${p.trakpro_id!==p.truck?" ("+esc(p.trakpro_id)+")":""}</td><td>${p.trailers.length?esc(p.trailers.join(", ")):'<span class="muted">not recorded</span>'}</td><td>${esc(p.driver||"")}</td><td class="muted">${esc((p.at||"").slice(6))}${p.via?" · "+esc(p.via):""}</td></tr>`).join("")}</table></div>
        ${(D.prestarts.trailerIns||[]).length?`<p class="muted small">Tanker pre-starts today: ${D.prestarts.trailerIns.map(x=>esc(x.asset+" "+(x.at||"").slice(6))).join(", ")}.</p>`:`<p class="muted small">No tanker pre-starts logged today.</p>`}`:""}
      ${D.prestarts.departed.length?`<p class="small" style="color:${D.prestarts.noPre.length?"var(--red)":"var(--green)"}">${D.prestarts.departed.length-D.prestarts.noPre.length} of ${D.prestarts.departed.length} trucks that departed today had a pre-start.${D.prestarts.noPre.length?" Missing: "+D.prestarts.noPre.join(", ")+".":""}</p>`:""}
      ${D.prestarts.issues?(()=>{const I=D.prestarts.issues, T=I.filter(i=>i.today), O=I.filter(i=>!i.today);
        const b=[[0,2,"1 to 2 days"],[2,7,"3 to 7 days"],[7,9999,"over 7 days"]].map(([lo,hi,l])=>[l,O.filter(i=>i.age_days>lo&&i.age_days<=hi).length]);
        const byA={}; O.forEach(i=>(byA[i.asset]=byA[i.asset]||[]).push(i));
        const rowsO=Object.entries(byA).sort((a,c)=>(c[1].some(i=>i.safety)-a[1].some(i=>i.safety))||(Math.max(...c[1].map(i=>i.age_days))-Math.max(...a[1].map(i=>i.age_days))));
        const item=i=>`<span style="color:${i.safety?"var(--red)":"inherit"}">${esc(i.item)}</span> <span class="muted">${esc((i.raised||"").slice(0,5))}, ${Math.round(i.age_days)} d</span>`;
        return `<h3 class="small" style="margin:10px 0 4px">Raised today (${T.length})</h3>
        ${T.length?`<div style="overflow-x:auto"><table class="small"><tr><th>Time</th><th>Asset</th><th>Item</th></tr>${T.map(i=>`<tr><td>${esc((i.raised||"").slice(6))}</td><td><b>${esc(i.asset)}</b></td><td style="color:${i.safety?"var(--red)":"inherit"}">${esc(i.item)}</td></tr>`).join("")}</table></div>`:`<p class="muted small">None so far today.</p>`}
        <h3 class="small" style="margin:12px 0 4px">Still open from before (${O.length}): ${b.map(([l,n])=>`${l} ${n}`).join(", ")}</h3>
        <div style="overflow-x:auto"><table class="small"><tr><th>Asset</th><th class="r">Open</th><th>Items (raised, age)</th></tr>
        ${rowsO.map(([a,L])=>`<tr><td><b>${esc(a)}</b></td><td class="r">${L.length}</td><td>${L.sort((x,y)=>(y.safety-x.safety)||(y.age_days-x.age_days)).map(item).join("; ")}</td></tr>`).join("")}</table></div>`;})()
      :`<div style="overflow-x:auto"><table class="small"><tr><th>Asset</th><th class="r">Open</th><th>Safety items</th><th>Other</th></tr>
      ${D.prestarts.faults.map(u=>`<tr><td><b>${esc(u.asset)}</b>${u.trakpro_id!==u.asset?" ("+esc(u.trakpro_id)+")":""}</td><td class="r">${u.open}</td><td style="color:${u.safety.length?"var(--red)":"inherit"}">${esc(u.safety.join(", ")||"–")}</td><td class="muted">${esc(u.other.join(", ")||"–")}</td></tr>`).join("")}</table></div>`}
      <p class="muted small">${D.prestarts.count} open faults on corridor assets. ${esc(D.prestarts.note||"")}</p>`:`<p class="muted">${esc(D.prestarts.note)}</p>`}
    </section>

    

    
  </div>
  <footer>${(D.notes||[]).map(esc).join(" ")} Collected by the Claude PC every 15 min, 24 hours a day (PNG time).</footer>`;
  document.getElementById("app").innerHTML = html;
  document.getElementById("msgBtn").onclick = openMsg;
  {let cur="road"; try{cur=(location.hash||"").slice(1)||"summary";}catch(e){}
   if(!document.querySelector('[data-t="'+cur+'"]')) cur="summary";
   const show=t=>{document.querySelectorAll("[data-tab]").forEach(el=>{const on=el.getAttribute("data-tab")===t; el.classList.toggle("on",on); el.style.display=on?"":"none";});
     document.querySelectorAll(".tab").forEach(b=>{b.classList.toggle("on",b.dataset.t===t);b.setAttribute("aria-selected",b.dataset.t===t);});
     try{localStorage.setItem("corr_tab",t);}catch(e){} if(t==="road") drawConvoyMap(D.cmap||[], D.strip.notOp||{});};
   const go=t=>{show(t); try{history.replaceState(null,"","#"+t);}catch(e){} try{window.scrollTo(0,0)}catch(e){};};
   document.querySelectorAll(".tab").forEach(b=>b.onclick=()=>go(b.dataset.t));
   document.querySelectorAll("[data-go]").forEach(b=>b.onclick=()=>go(b.dataset.go));
   show(cur);}
  drawConvoyMap(D.cmap||[], D.strip.notOp||{});
  askWire();
  if(document.querySelectorAll) document.querySelectorAll(".dot").forEach(el=>el.onclick=()=>{document.getElementById("stripTip").textContent=el.getAttribute("data-tip");});
}

function buildMsg(){
  const f=D.fuel, fa=D.fatigue, b=D.bags, st=D.strip;
  const g = n => st.groups.find(p=>p.name.startsWith(n));
  const below = fa.rows.filter(r=>r.score<fa.threshold).map(r=>`${r.name} ${r.score}${r.role?" ("+r.role+")":""}`).join(", ");
  const cross = fa.rows.filter(r=>r.at).map(r=>`${r.name} ${r.at}`).join(", ");
  const kgFarm = name => { const fm=f.farms.find(x=>x.name.startsWith(name)); return fm? kl(fm.tanks.reduce((a,t)=>a+t.vol,0))+" kL at "+fm.asOf : "TBC"; };
  const red = D.flags.filter(x=>x.lvl==="red").map(x=>"⚠️ "+x.text);
  return [
    `*${D.title} – Daily Update*`,
    `*${D.day}, updated ${D.updated}*`,
    ...(red.length?["",...red]:[]),
    "", "*TRUCKS*",
    `• Departures today: ${fmt(D.trucks.tripsNorth)} northbound loaded (Aiambak to WB Kiunga), ${fmt(D.trucks.tripsSouth)} southbound (WB Kiunga to Aiambak). Yesterday: ${D.trucks.yNorth??"–"} / ${D.trucks.ySouth??"–"}`,
    ...D.convoys.map(c=>`• ${c.name} (${c.tag}): ${[c.units,c.crew,c.status].filter(Boolean).join(" ")}${(c.issues||[]).filter(i=>!/coverage gap/.test(i.text)).length?" Issues: "+c.issues.filter(i=>!/coverage gap/.test(i.text)).map(i=>i.text).join(" "):""}`),
    `• At ${st.asOf}: Aiambak ${g("At Aiambak").units.length} | West Bank ${g("At West Bank").units.length} | On road ${st.groups.filter(p=>p.kind==="move").reduce((a,p)=>a+p.units.length,0)} | Not reporting ${g("Not reporting").units.join(", ")}`,
    "", "*CUCON BAGS*",
    ...(D.cucon?(()=>{const S=D.cucon.stages||[], g=k=>S.find(x=>x.name.toLowerCase().includes(k))||{}; const r=v=>v==null?"–":Math.round(v).toLocaleString("en-AU");
      return [`• Report ${D.cucon.date.slice(8,10)}/${D.cucon.date.slice(5,7)}: bagged ${r(g("bagged").day_bags)} (target ${r(g("bagged").target_bags)}), to East Bank ${r(g("east bank").day_bags)}, trucked ${r(g("trucked").day_bags)}, shipped ${r(g("loaded").day_bags)}`,
              `• To date: bagged ${r(g("bagged").ptd_bags)} | East Bank ${r(g("east bank").ptd_bags)} | trucked ${r(g("trucked").ptd_bags)} | shipped ${r(g("loaded").ptd_bags)}`,
              ...(D.cucon.critical||[]).length?[`• Critical: ${D.cucon.critical.join("; ")}`]:[]];})():[]),
    ...(()=>{const x=(D.bagShifts||[]).find(r=>!r.in_progress&&r.total!=null); return x?[`• ${x.date.slice(8,10)}/${x.date.slice(5,7)}: day ${x.day??"–"}, night ${x.night??"–"}, total ${x.total} (plan ${D.bagTarget??"TBC"})`]:[];})(),
    `• Filled today: ${fmt(b.today)} | Since 1 Oct: ${fmt(b.sinceOct1)} (about ${Math.round(b.sinceOct1/b.days)}/day vs plan ${b.planPerDay})`,
    ...(D.perf&&D.perf.rows.length?["", `*PERFORMANCE vs PLAN (${D.perf.month})*`, ...D.perf.rows.filter(r=>r.actual!=null).map(r=>`• ${r.metric}: ${r.unit==="L"?Math.round(r.actual).toLocaleString("en-AU")+" L":r.actual} vs ${planTxt(r.plan)}`)]:[]),
    "", "*FUEL (Veeder-Root TLS, 13:00–13:00)*",
    `• Received into Kiunga: ${f.received==null?"TBC":kl(f.received)+" kL (est.)"} | Out of Kiunga to TBG: ${f.toTbg==null?"TBC":kl(f.toTbg)+" kL (est.)"} | Into Tabubil: ${f.tbgReceived==null?"TBC":kl(f.tbgReceived)+" kL (est.)"}`,
    `• Stock: Kiunga ${kgFarm("Kiunga")} | Tabubil ${kgFarm("Tabubil")}`,
    ...f.farms.filter(fm=>fm.x).map(fm=>`• ${fm.name.split(" ")[0]} usable ${kl(fm.x.usable)} kL, ${fm.x.available<0?"BELOW":"above"} ${kl(fm.x.buffer)} kL buffer by ${kl(Math.abs(fm.x.available))} kL`),
    ...(D.fleet&&Object.keys(D.fleet.groups||{}).length?["", "*FLEET (shift report "+(D.fleet.date||"")+")*",
      "• "+["PRIME MOVERS","FUEL TANKERS","FLAT DECK TRAILERS","TOTAL FLEETS"].filter(k=>D.fleet.groups[k]).map(k=>`${k.charAt(0)+k.slice(1).toLowerCase()} ${D.fleet.groups[k].available}/${D.fleet.groups[k].total}`).join(" | "),
      ...D.fleet.down.map(a=>`• Down: ${a.id}${a.trakpro_id!==a.id?" ("+a.trakpro_id+")":""} ${(a.comment||"").replace(/^DOWN\s*:\s*/i,"")}`)]:[]),
    "", "*ROAD*", ...D.road.items.map(i=>"• "+i),
    "", "*FATIGUE / PRE-STARTS*",
    `• Below 70 now: ${below||"none"}`,
    ...(D.adas&&D.adas.units.length?[`• Driver cameras 24 h: ${D.adas.units.map(u=>u.unit+" "+Object.entries(u.types).map(([k,v])=>k.toLowerCase()+" "+v.n24).join("/")).join("; ")}`]:[]),
    `• Reaching 70 later today: ${cross||"none"}`,
    ...(D.prestarts.faults?[`• Pre-starts today: ${D.prestarts.today.length}; departed without one: ${D.prestarts.noPre.join(", ")||"none"}`,
      `• Open ChekRite faults: ${D.prestarts.count} (${D.prestarts.faults.filter(u=>u.safety.length).map(u=>u.asset+": "+u.safety.join("/")).join("; ")||"no safety items"})`]:[`• Chekrite: TBC`]),
    "", "*FLAGS*", ...D.flags.filter(x=>x.lvl!=="red").map(x=>"• "+x.text)
  ].join("\n");
}

function openMsg(){
  const dlg=document.getElementById("msgDlg"), ta=document.getElementById("msgText");
  ta.value=buildMsg(); dlg.showModal(); ta.focus(); ta.select();
}
document.getElementById("closeBtn").onclick=()=>document.getElementById("msgDlg").close();
document.getElementById("copyBtn").onclick=async e=>{
  const ta=document.getElementById("msgText");
  try{ await navigator.clipboard.writeText(ta.value); e.target.textContent="Copied"; }
  catch{ ta.select(); document.execCommand && document.execCommand("copy"); e.target.textContent="Copied"; }
  setTimeout(()=>e.target.textContent="Copy text",1500);
};
load();
setInterval(load, 2*60*1000);
if(typeof window!=="undefined" && window.addEventListener){ let rt; window.addEventListener("resize",()=>{clearTimeout(rt); rt=setTimeout(()=>{ if(D) render(); },300);}); }
</script>
</body>
</html>
